<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hollow marks</title><style>
@font-face{font-family:HLC;src:url(../../../src/assets/fonts/hollowlight-chancery.woff2) format('woff2')}
@font-face{font-family:AS;src:url(../../../src/assets/fonts/alegreya-sans-400.woff2) format('woff2');font-weight:400}
@font-face{font-family:AS;src:url(../../../src/assets/fonts/alegreya-sans-700.woff2) format('woff2');font-weight:700}
:root{--ink:#140f0c;--brass:#d8b26a;--brassD:#8d6c34;--cream:#fff3dc;--dim:rgba(255,243,220,.82);--mute:#a8b0c4;--teal:#6fd3c5;--gold:#ffd36b;--lock:#6b7490;
 --glassA:#303c56;--glassB:#161c2a;--night:#0c1220;--dusk:#ffb867;--deep:#9aa8ff;--long:#c9c2ff;--dawn1:#ffd0b0;--dawn2:#bfeaf0;--danger:#ff5a3c;
 --u:min(1vw,1.78vh)}
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--night);color:var(--cream);font-family:AS,"Segoe UI",sans-serif}
h1,h2,.title{font-family:HLC,Georgia,serif;font-weight:400}
.coin,.shard,.glass{display:inline-block;vertical-align:-.12em;margin-right:.22em}
.coin{width:.85em;height:.85em;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff0b0,#d8b26a 60%,#8d6c34);box-shadow:0 0 0 1.5px var(--ink)}
.shard{width:.72em;height:.9em;background:linear-gradient(135deg,#e9ddff,#9d86ff);clip-path:polygon(50% 0,100% 40%,70% 100%,30% 100%,0 40%)}
.glass{width:.72em;height:.95em;background:linear-gradient(160deg,#fff7ee 0%,var(--dawn1) 45%,var(--dawn2) 100%);clip-path:polygon(50% 0,92% 34%,74% 100%,26% 100%,8% 34%);filter:drop-shadow(0 0 3px rgba(255,208,176,.7))}
.pill{display:inline-flex;align-items:center;gap:.3em;padding:.18em .7em;border-radius:99px;border:1.5px solid var(--brassD);background:rgba(12,9,8,.6);font-weight:700;font-variant-numeric:tabular-nums}
.k{font-size:max(12px,calc(var(--u)*1.25));letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
.new{color:var(--teal);font-weight:700;letter-spacing:.08em}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:0 calc(var(--u)*3);border-radius:calc(var(--u)*1.4);font-weight:700;font-size:max(15px,calc(var(--u)*2));color:#2a1a08;background:linear-gradient(#ffe7b0,#e6b862);border:2px solid #6b4a1c;box-shadow:0 3px 0 #4a3210,0 0 18px rgba(255,190,100,.35)}
.btn.ghost{color:var(--cream);background:rgba(20,26,40,.8);border-color:var(--brassD);box-shadow:none}
.bar{position:relative;height:max(8px,calc(var(--u)*.9));border-radius:99px;background:#0b0f18;border:1.5px solid rgba(111,211,197,.45);overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#2f8f86,var(--teal))}
.star{display:inline-block;width:1em;height:1em;vertical-align:-.15em;background:var(--brass);clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%)}
.star.off{background:#3a4258}
.star.dawn{background:linear-gradient(160deg,#fff7ee,var(--dawn1) 55%,var(--dawn2))}
</style></head><body><div style="position:fixed;inset:0;background:radial-gradient(ellipse 90% 80% at 50% 40%,#1a2238,#0b0f1a 80%)"><svg viewBox="0 0 1280 720" style="position:absolute;inset:0;width:100%;height:100%"><text x="40" y="60" fill="#fff3dc" font-size="30" font-family="HLC,Georgia">Hollow marks (affixes) on Deep Dusk / Long Night</text><text x="40" y="88" fill="#a8b0c4" font-size="15" font-family="AS">Schematic husk, not final art. One mark per foe, one verb each, readable by SHAPE first (colour-blind safe); 5% of spawns from 4:00 (Deep Dusk), 10% from 2:30 (Long Night).</text><rect x="30" y="120" width="280" height="470" rx="16" fill="#161c2a" stroke="#8d6c34" stroke-width="2"/><ellipse cx="170" cy="316" rx="26" ry="6" fill="#000" opacity=".35"/><path d="M146 310 q-4 -30 24 -38 q28 8 24 38Z" fill="#3a3a48" stroke="#565a70" stroke-width="2.5"/><ellipse cx="170" cy="284" rx="16" ry="13" fill="#cfc6ae" stroke="#8a8068" stroke-width="2"/><circle cx="164" cy="284" r="2.6" fill="#ffb84a"/><circle cx="176" cy="284" r="2.6" fill="#ffb84a"/><path d="M154 280 l10 -6 l8 4 l-2 10 l-12 2Z M174 276 l12 2 l2 10 l-10 2Z" fill="#d9cdb0" stroke="#6b5a40" stroke-width="2"/><text x="170" y="190" text-anchor="middle" fill="#fff3dc" font-size="26" font-family="HLC,Georgia">Ironbark</text><text x="170" y="420" text-anchor="middle" fill="#6fd3c5" font-size="18" font-family="AS" font-weight="700">Outlast it</text><text x="170" y="450" text-anchor="middle" fill="#fff3dcd0" font-size="15" font-family="AS">hp x1.8, speed x0.85</text><text x="170" y="476" text-anchor="middle" fill="#a8b0c4" font-size="13.5" font-family="AS">bark plates over the mask (shape, not colour)</text><rect x="340" y="120" width="280" height="470" rx="16" fill="#161c2a" stroke="#8d6c34" stroke-width="2"/><ellipse cx="480" cy="316" rx="26" ry="6" fill="#000" opacity=".35"/><path d="M456 310 q-4 -30 24 -38 q28 8 24 38Z" fill="#3a3a48" stroke="#565a70" stroke-width="2.5"/><ellipse cx="480" cy="284" rx="16" ry="13" fill="#cfc6ae" stroke="#8a8068" stroke-width="2"/><circle cx="474" cy="284" r="2.6" fill="#ffb84a"/><circle cx="486" cy="284" r="2.6" fill="#ffb84a"/><path d="M420 286 q30 -10 40 -2 M410 296 q34 -8 46 0 M424 304 q26 -6 34 0" stroke="#9a8cff" stroke-width="3" fill="none" opacity=".8"/><text x="480" y="190" text-anchor="middle" fill="#fff3dc" font-size="26" font-family="HLC,Georgia">Swiftshade</text><text x="480" y="420" text-anchor="middle" fill="#6fd3c5" font-size="18" font-family="AS" font-weight="700">Out-turn it</text><text x="480" y="450" text-anchor="middle" fill="#fff3dcd0" font-size="15" font-family="AS">speed x1.3, hp x0.8</text><text x="480" y="476" text-anchor="middle" fill="#a8b0c4" font-size="13.5" font-family="AS">cold violet streak, always on</text><rect x="650" y="120" width="280" height="470" rx="16" fill="#161c2a" stroke="#8d6c34" stroke-width="2"/><ellipse cx="790" cy="316" rx="26" ry="6" fill="#000" opacity=".35"/><path d="M766 310 q-4 -30 24 -38 q28 8 24 38Z" fill="#3a3a48" stroke="#565a70" stroke-width="2.5"/><ellipse cx="790" cy="284" rx="16" ry="13" fill="#cfc6ae" stroke="#8a8068" stroke-width="2"/><circle cx="784" cy="284" r="2.6" fill="#ffb84a"/><circle cx="796" cy="284" r="2.6" fill="#ffb84a"/><path d="M782 274 l4 6 l-3 5 M796 276 l-2 7" stroke="#ff8a4a" stroke-width="2.5" fill="none"/><ellipse cx="790" cy="320" rx="34" ry="10" fill="none" stroke="#ff5a3c" stroke-width="3" stroke-dasharray="6 4"/><text x="790" y="190" text-anchor="middle" fill="#fff3dc" font-size="26" font-family="HLC,Georgia">Emberwake</text><text x="790" y="420" text-anchor="middle" fill="#6fd3c5" font-size="18" font-family="AS" font-weight="700">Step out of it</text><text x="790" y="450" text-anchor="middle" fill="#fff3dcd0" font-size="15" font-family="AS">death leaves a 28 px ring for 1.2 s</text><text x="790" y="476" text-anchor="middle" fill="#a8b0c4" font-size="13.5" font-family="AS">ember cracks; red-orange = danger only</text><rect x="960" y="120" width="280" height="470" rx="16" fill="#161c2a" stroke="#8d6c34" stroke-width="2"/><ellipse cx="1100" cy="316" rx="26" ry="6" fill="#000" opacity=".35"/><path d="M1076 310 q-4 -30 24 -38 q28 8 24 38Z" fill="#3a3a48" stroke="#565a70" stroke-width="2.5"/><ellipse cx="1100" cy="284" rx="16" ry="13" fill="#cfc6ae" stroke="#8a8068" stroke-width="2"/><circle cx="1094" cy="284" r="2.6" fill="#ffb84a"/><circle cx="1106" cy="284" r="2.6" fill="#ffb84a"/><circle cx="1100" cy="294" r="6" fill="#c9c2ff" opacity=".9"/><path d="M1100 294 L1160 270 M1100 294 L1042 316" stroke="#c9c2ff" stroke-width="1.5" opacity=".6"/><circle cx="1162" cy="269" r="9" fill="#2a2a3a"/><circle cx="1040" cy="317" r="9" fill="#2a2a3a"/><text x="1100" y="190" text-anchor="middle" fill="#fff3dc" font-size="26" font-family="HLC,Georgia">Hollowheart</text><text x="1100" y="420" text-anchor="middle" fill="#6fd3c5" font-size="18" font-family="AS" font-weight="700">Kill it first</text><text x="1100" y="450" text-anchor="middle" fill="#fff3dcd0" font-size="15" font-family="AS">neighbours within 60 px +15% speed</text><text x="1100" y="476" text-anchor="middle" fill="#a8b0c4" font-size="13.5" font-family="AS">chest glow + thin threads (Long Night only)</text><text x="40" y="640" fill="#a8b0c4" font-size="14" font-family="AS">Marked foes drop x5 gold and (Deep Dusk / Long Night only) 1 dawnglass each, capped 2 / 3 per run. Never on bosses; Alphas get at most Ironbark on Long Night.</text></svg></div></body></html>
