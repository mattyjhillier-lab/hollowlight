-79.4" stroke="#3f6b6e" stroke-width="1.3" stroke-dasharray="3 2.4" opacity=".6"/></g></g></g><rect x="788" y="100" width="484" height="544" rx="10" fill="#161e29" stroke="#3a4757"/><text x="800" y="120" font-family="Georgia,'Palatino Linotype',serif" font-size="12.5" font-weight="900" fill="#ffd98a" text-anchor="start">HOW IT IS ANIMATED IN CODE (no hand-drawn frames)</text><text x="800" y="142" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">IDLE</text><text x="800" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">body.scaleY = 1 + .025*sin(t), pivot at the feet (breathing)</text><text x="800" y="171.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">head.y -1.2px, head.angle +-1.5 deg (pivot = neck); ears lag 0.15 s</text><text x="800" y="184.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">scarf = 5 linked segments, angle = A*sin(t - i*.6); lantern = damped pendulum</text><text x="800" y="197.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">blink = swap the eye texture for 0.12 s every 3-5 s</text><text x="800" y="244" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">WALK</text><text x="800" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">phase advances with DISTANCE: foot.x = +-stride*sin(phase), lift 4px</text><text x="800" y="273.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">contact frames squash (x1.04, y.95), passing frames stretch; bob 3px; lean 6 deg</text><text x="800" y="286.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">scarf follows a ring-buffer of past root positions, so it always streams</text><text x="800" y="299.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">behind her (about 2x body length at speed); lantern swings against the legs</text><text x="800" y="346" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">HURT</text><text x="800" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">0-60 ms white tint (setTintFill), then red tint until 0.25 s</text><text x="800" y="375.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">squash 1.12 x .88 with spring-back; knockback 6-9px, ease-out</text><text x="800" y="388.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">swap to the hurt face, lantern glow dips to 30%</text><text x="800" y="401.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">then 1.2 s i-frames: alpha blinks .65/1 at 10 Hz</text><text x="800" y="448" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">DEATH</text><text x="800" y="464" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">squash to .78 + closed-eyes face; an additive cream-amber copy fades in</text><text x="800" y="477.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">body alpha 1 -> .4 while it stretches 14% and rises 16px</text><text x="800" y="490.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">scarf segments unwind to -90 deg, staggered 40 ms; 8-12 sparks drift up</text><text x="800" y="503.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">the lantern stays on the ground and keeps glowing</text><text x="800" y="550" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">HOWL</text><text x="800" y="566" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">0.2 s crouch (scaleY .93, lean 4 deg), then pop: head -22 deg, lantern arm up</text><text x="800" y="579.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">howl mouth texture; scarf segments snap to -90 deg and stiffen (like a flame)</text><text x="800" y="592.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">ring = pooled additive ellipse, scale 0 -> R in .6 s, alpha 1 -> 0</text><text x="800" y="605.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.8" font-weight="500" fill="#d3dce6" text-anchor="start">wolves: bright overlay + 1.1 scale pulse; enemies in range flee</text><rect x="8" y="650" width="1264" height="64" rx="10" fill="#161e29" stroke="#3a4757"/><text x="20" y="670" font-family="Georgia,'Palatino Linotype',serif" font-size="12" font-weight="900" fill="#ffd98a" text-anchor="start">RIG</text><text x="62" y="670" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="500" fill="#d3dce6" text-anchor="start">layers: scarf (5 seg) > legs+boots (2) > body/coat > belt+patch+whistle > lantern arm > head [ears(2) > hood > fur trim > face > fringe] > collar+knot. Origin = feet.</text><text x="62" y="686" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="500" fill="#d3dce6" text-anchor="start">pivots: root (0,0) | body (0,-13) | head/neck (0,-38) | ear bases (+-19,-78) | scarf root (back of neck) | lantern/shoulder hands (+-23,-36). Dots on IDLE 0: pink = root + neck, blue = ear bases.</text><rect x="0" y="0" width="700" height="92" fill="#07090d" opacity=".92"/><rect x="0" y="92" width="700" height="3" fill="#ffb84a"/><text x="12" y="30" font-family="Georgia,'Palatino Linotype',serif" font-size="26" font-weight="900" fill="#fff" text-anchor="start" letter-spacing="0.3">WREN DESIGN SHEET v1 - Hollowlight Style v1</text><text x="12" y="48" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="700" fill="#ffd98a" text-anchor="start">STYLE CODE: L2 tinted outline + H2 soft gradient/rim + P1 chibi + W2 textured ground</text><text x="12" y="62" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="700" fill="#ffd98a" text-anchor="start">G1 lantern pool + G2 glow trails | mood P1 Warm Lantern (golden light on cool grey-blue)</text><circle cx="22" cy="80" r="9" fill="#74a09b" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="36" y="84" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#e8edf3" text-anchor="start">#74a09b hood</text><circle cx="130" cy="80" r="9" fill="#f2a335" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="144" y="84" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#e8edf3" text-anchor="start">#f2a335 scarf</text><circle cx="238" cy="80" r="9" fill="#ffd05a" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="252" y="84" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#e8edf3" text-anchor="start">#ffd05a flame</text><circle cx="346" cy="80" r="9" fill="#f3e7cf" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="360" y="84" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="600" fill="#e8edf3" text-anchor="start">#f3e7cf fur</text><circle cx="454" cy="80" r="9" fill="#2b3441" stroke="#fff" stroke-o
