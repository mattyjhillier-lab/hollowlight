*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#0b101c;overflow:hidden}
:root{--cream:#fff3dc;--brass:#d8b26a;--gold:#ffd27a;--mute:#b3bbcf;--ink:#07070d;--teal:#6fd3c5;--glass:rgba(16,21,38,.74)}
.scr{position:relative;overflow:hidden;font-family:"Alegreya Sans","Trebuchet MS",sans-serif;color:var(--cream)}
.scr>svg.bg{position:absolute;left:0;top:0}
.abs{position:absolute}
.disp{font-family:"Chancery",Georgia,serif;font-weight:400}
.pill{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 16px;border-radius:999px;background:linear-gradient(180deg,rgba(48,60,86,.82),rgba(22,28,46,.86));border:1px solid rgba(216,178,106,.5);box-shadow:0 2px 10px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.12);font-size:16px;font-weight:700;color:var(--cream);white-space:nowrap}
.pill.sm{height:32px;padding:0 12px;font-size:14px}
.dot{display:inline-block;width:14px;height:14px;border-radius:50%}
.glass{background:linear-gradient(180deg,rgba(40,50,74,.82),rgba(16,21,38,.88));border:1px solid rgba(216,178,106,.5);border-radius:18px;box-shadow:0 8px 30px rgba(0,0,0,.4), inset 0 1px 0 rgba(255,255,255,.12)}
.goal{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap;text-align:center}
.goal .g1{font-weight:700;font-size:16px;padding:5px 14px;border-radius:999px;background:rgba(14,19,34,.82);border:1.5px solid var(--brass);box-shadow:0 0 18px rgba(255,210,122,.5), 0 2px 8px rgba(0,0,0,.4);color:var(--cream)}
.goal .g1 b{color:var(--gold)}

.nm{font-family:"Chancery",Georgia,serif;font-size:28px;line-height:1;color:#fff3dc;text-shadow:0 0 3px #07070d,0 0 3px #07070d,0 0 8px #07070d,0 2px 10px rgba(0,0,0,.8);white-space:nowrap}
.nm.dim{color:#cfd7ea}
.sub{font-size:15px;font-weight:700;margin-top:3px;text-shadow:0 0 4px #07070d,0 0 8px #07070d;white-space:nowrap}
.lab{position:absolute;transform:translate(-50%,0);display:flex;flex-direction:column;align-items:center;gap:6px}
.lab.left{transform:none;align-items:flex-start}
.gp{font-weight:700;font-size:16px;padding:5px 14px;border-radius:999px;background:rgba(14,19,34,.86);border:1.5px solid #8b7b5a;color:#e9e2d0;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.5)}
.gp.hot{border-color:#ffd27a;color:#fff3dc;box-shadow:0 0 0 3px rgba(255,210,122,.18),0 0 22px rgba(255,210,122,.55),0 2px 8px rgba(0,0,0,.5)}
.gp b{color:#ffd27a;font-weight:700}
.top{position:absolute;left:16px;right:16px;top:14px;display:flex;align-items:center;gap:10px}
.top .ttl{font-family:"Chancery",Georgia,serif;font-size:32px;margin-left:6px;text-shadow:0 2px 8px #000}
.meter{display:flex;align-items:center;gap:10px;height:44px;padding:0 16px 0 10px;border-radius:999px;background:linear-gradient(180deg,rgba(48,60,86,.82),rgba(22,28,46,.88));border:1px solid rgba(216,178,106,.5);font-weight:700;font-size:15px}
.meter .bar{width:120px;height:10px;border-radius:6px;background:#1a2036;border:1px solid #4a5370;overflow:hidden}
.meter .bar i{display:block;height:100%;background:linear-gradient(90deg,#ffb84a,#ffe9a8)}
.meter .ic{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle at 50% 40%,#fff8e6,#ffc766 55%,#c8843a);box-shadow:0 0 12px rgba(255,200,100,.7)}
.circ{width:40px;height:40px;padding:0;justify-content:center}
.panel{position:absolute;left:322px;right:322px;bottom:16px;height:112px;display:flex;flex-wrap:wrap;gap:6px 10px;padding:8px 14px 10px;align-items:stretch}
.panel .hd{flex:0 0 100%;font-family:"Chancery",Georgia,serif;font-size:21px;color:#ffd27a;line-height:1}
.card{flex:1;border-radius:12px;padding:7px 10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:flex;flex-direction:column;justify-content:center;gap:3px;min-width:0}
.card.hot{border-color:rgba(255,210,122,.7);background:rgba(255,210,122,.1)}
.card .t{font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .s{font-size:14px;color:#c9cfe0;display:flex;justify-content:space-between;gap:6px;white-space:nowrap}
.card .s b{color:#ffd27a}
.card .pb{height:6px;border-radius:4px;background:#1a2036;overflow:hidden}
.card .pb i{display:block;height:100%;background:linear-gradient(90deg,#6fd3c5,#bff3e8)}
.zoom{position:absolute;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.zoom .pill{width:42px;height:42px;padding:0;justify-content:center;font-size:22px}
.tip{position:absolute;transform:translate(-50%,0);text-align:center}
