61" stroke-width="4.14" stroke-linejoin="round" stroke-linecap="round"/><path d="M-9.8 -26.5 a9.8 9.8 0 1 0 19.6 0 a9.8 9.8 0 1 0 -19.6 0Z" fill="url(#g918)"/><path d="M-9.8 -26.5 a9.8 9.8 0 1 0 19.6 0 a9.8 9.8 0 1 0 -19.6 0Z" fill="#fff0c0" opacity="0.9" mask="url(#m2066)"/><path d="M-2.0 -35.3 L0.5 -40.9 L3.0 -35.1Z" fill="#7b6161" stroke="#7b6161" stroke-width="2.3" stroke-linejoin="round" stroke-linecap="round"/><path d="M-2.0 -35.3 L0.5 -40.9 L3.0 -35.1Z" fill="url(#g918)"/><path d="M-2.0 -35.3 L0.5 -40.9 L3.0 -35.1Z" fill="#fff0c0" opacity="0.9" mask="url(#m2067)"/><path d="M-3.6 -23.1 a3.6 3.3 0 1 0 7.2 0 a3.6 3.3 0 1 0 -7.2 0Z" fill="#7b6770" stroke="#7b6770" stroke-width="3.2199999999999998" stroke-linejoin="round" stroke-linecap="round"/><path d="M-3.6 -23.1 a3.6 3.3 0 1 0 7.2 0 a3.6 3.3 0 1 0 -7.2 0Z" fill="url(#g922)"/><path d="M-3.6 -23.1 a3.6 3.3 0 1 0 7.2 0 a3.6 3.3 0 1 0 -7.2 0Z" fill="#fff4cd" opacity="0.9" mask="url(#m2068)"/><ellipse cx="0.0" cy="-24.7" rx="1.7" ry="1.2" fill="#3a2418"/><path d="M-1.6 -21.9 Q0.0 -18.3 1.8 -21.9Z" fill="#ff9a8a" stroke="#c0605a" stroke-width=".5"/><path d="M-7.8 -26.3 Q-5.7 -30.6 -3.6 -26.3" fill="none" stroke="#5a2e10" stroke-width="1.5" stroke-linecap="round"/><path d="M3.6 -26.3 Q5.7 -30.6 7.8 -26.3" fill="none" stroke="#5a2e10" stroke-width="1.5" stroke-linecap="round"/><ellipse cx="-8.5" cy="-22.3" rx="2.4" ry="1.7" fill="#ff9a7a" opacity=".5"/><ellipse cx="8.5" cy="-22.3" rx="2.4" ry="1.7" fill="#ff9a7a" opacity=".5"/></g><path d="M-7.5 -18.3 Q0.5 -14.7 8.0 -18.5" fill="none" stroke="#ffb84a" stroke-width="1.7" stroke-linecap="round"/><circle cx="0.5" cy="-15.3" r="1.6" fill="#ffb84a" stroke="#a8541a" stroke-width=".5"/></g></g><rect x="788" y="100" width="484" height="544" rx="10" fill="#161e29" stroke="#3a4757"/><text x="800" y="120" font-family="Georgia,'Palatino Linotype',serif" font-size="12.5" font-weight="900" fill="#ffd98a" text-anchor="start">HOW IT IS ANIMATED IN CODE (no hand-drawn frames)</text><text x="800" y="142" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">IDLE</text><text x="800" y="158" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">body.scaleY = 1 + .03*sin(t), pivot at feet; head tilt +-3 deg (pivot = neck)</text><text x="800" y="171.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">ears lag the head 0.15 s; one ear flick per 4 s; glints blink 0.12 s every 3-5 s</text><text x="800" y="184.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">ember = spring toward (33,-80) + bob 3px; thread is a 6-point verlet rope</text><text x="800" y="197.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">PUP: sits, tail tip draws a small arc of light, head tilts at random (curious)</text><text x="800" y="244" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">RUN</text><text x="800" y="260" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">phase advances with DISTANCE: foot.x = +-6.5*cos(phase), lift 5px, bob 3.5px</text><text x="800" y="273.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">pelt tail = 3 segments, angle A*sin(phase), plus an additive amber streak behind</text><text x="800" y="286.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">ember trails 6px behind and bobs at 2x frequency</text><text x="800" y="299.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">PUP: spring-follows a heel point 46-80px behind (lag 0.18 s); 4-leg bound, ears back</text><text x="800" y="346" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">HURT</text><text x="800" y="362" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">0-60 ms white tint, then red tint to 0.25 s; squash 1.12 x .88, knockback 6-9px</text><text x="800" y="375.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">glints swap to "> &lt;", ears fold flat, ember shrinks to 65% and flickers</text><text x="800" y="388.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">then 1.2 s i-frames: alpha .65/1 at 10 Hz</text><text x="800" y="401.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">PUP: ears flat + whimper pose for 0.6 s, then trots back to heel</text><text x="800" y="448" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">DEATH</text><text x="800" y="464" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">squash to .78, glints soften to arcs; additive cream-amber copy fades in</text><text x="800" y="477.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">body alpha 1 -> .4 while it stretches 14% and rises 16px; 8-12 sparks drift up</text><text x="800" y="490.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">ember sinks to the ground and keeps glowing; it is the last light to go</text><text x="800" y="503.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">PUP: does not fade; sits where she stood, head up (the saddest frame)</text><text x="800" y="550" font-family="Consolas,'Courier New',monospace" font-size="11" font-weight="900" fill="#ffb84a" text-anchor="start">HOWL</text><text x="800" y="566" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">0.2 s crouch (scaleY .93), then pop: head -20 deg, glints close, mouth glows</text><text x="800" y="579.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">ring = pooled additive ellipse, scale 0 -> R in .6 s; ember flares x1.3 + sparks</text><text x="800" y="592.4" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">wolves: bright overlay + 1.1 scale pulse; amber threads flare upward</text><text x="800" y="605.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.6" font-weight="500" fill="#d3dce6" text-anchor="start">PUP: sits, throws its head back, tiny howl rings (visual only), wags on release</text><rect x="8" y="650" width="1264" height="66" rx="10" fill="#161e29" stroke="#3a4757"/><text x="20" y="666" font-family="Georgia,'Palatino Linotype',serif" font-size="12" font-weight="900" fill="#ffd98a" text-anchor="start">RIG</text><text x="62" y="666" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="900" fill="#ffb84a" text-anchor="start">WREN</text><text x="116" y="666" font-family="'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="500" fill="#d3dce6" text-anchor="start">pelt-tail streak (3 seg) > legs+boots (2) > cape back > tunic + hem stitch > mantle + forepaw ties > hands (2) > head [ears(2) > hood > fringe > void > glints(2) > muzzle+nose]. Origin = feet.</text><text x="62" y="678.6" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="900" fill="#ffb84a" text-anchor="start">PUP</text><text x="116" y="678.6" font-family="'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="500" fill="#d3dce6" text-anchor="start">ember tail tip (own sprite + glow) > tail (2 seg) > hind legs (2) > body > fore legs (2) > head [ears(2) > face > thread collar]. Origin = paws. Spring-follows a heel point.</text><text x="62" y="691.2" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="900" fill="#ffb84a" text-anchor="start">EMBER</text><text x="116" y="691.2" font-family="'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="500" fill="#d3dce6" text-anchor="start">cage sprite pivot = centre, hang ring (0,-14.6). Thread = 6-point verlet rope from the right hand (16,-47); ember target (33,-80); glow = additive sprite alpha .6-1.</text><text x="62" y="703.8" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="900" fill="#ffb84a" text-anchor="start">PIVOTS</text><text x="116" y="703.8" font-family="'Segoe UI',Arial,sans-serif" font-size="9.4" font-weight="500" fill="#d3dce6" text-anchor="start">root (0,0) | body (0,-13) | neck (0,-66) | ear bases (+-13,-96) | hands (16,-47) and (-17,-34) | ember anchor (33,-80) | pup root (-46,0), pup neck (6,-27), pup tail root (-12,-14). IDLE 0 dots: pink root+neck, blue ears, amber ember, green pup root+neck.</text><rect width="700" height="92" fill="#07090d" opacity=".95"/><rect y="92" width="700" height="3" fill="#ffb84a"/><text x="12" y="29" font-family="Georgia,'Palatino Linotype',serif" font-size="25" font-weight="900" fill="#fff" text-anchor="start">WREN v2 ANIMATION: Pelt Walker + Pup</text><text x="12" y="45" font-family="Consolas,'Courier New',monospace" font-size="9.6" font-weight="700" fill="#ffd98a" text-anchor="start">Code-driven strips: idle, run with pup following, hurt, fade-to-light death, Pack Howl.</text><text x="12" y="57" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="600" fill="#b8c4d0" text-anchor="start">STYLE CODE: L2 tinted outline + H2 soft gradient/rim + P1 chibi + W2 textured ground</text><text x="12" y="68" font-family="Consolas,'Courier New',monospace" font-size="9.4" font-weight="600" fill="#b8c4d0" text-anchor="start">G1 lantern pool + G2 glow trails | mood P1 Warm Lantern (golden light on cool grey-blue)</text><circle cx="22" cy="80" r="9" fill="#cdd9e2" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="36" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#cdd9e2 pelt</text><circle cx="134" cy="80" r="9" fill="#34506a" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="148" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#34506a tunic</text><circle cx="246" cy="80" r="9" fill="#121923" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="260" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#121923 face</text><circle cx="358" cy="80" r="9" fill="#ffb84a" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="372" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#ffb84a amber</text><circle cx="470" cy="80" r="9" fill="#ffe8b0" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="484" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#ffe8b0 pup</text><circle cx="582" cy="80" r="9" fill="#efe4cc" stroke="#fff" stroke-opacity=".75" stroke-width="1.6"/><text x="596" y="84" font-family="Consolas,'Courier New',monospace" font-size="10.5" font-weight="600" fill="#e8edf3" text-anchor="start">#efe4cc bone</text></svg></body></html>
